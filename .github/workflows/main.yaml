name: Continuous integration

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    outputs:
      success-latest: ${{ steps.success.outputs.success-latest }}
      success-3-5-1: ${{ steps.success.outputs.success-3-5-1 }}

    strategy:
      fail-fast: true
      matrix:
        helm:
          - latest
          - 3.5.1

    steps:
      - run: docker system prune --all --force
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python3 -m pip install --requirement=ci/requirements.txt

      # Pre-commit regenerates the checked-in fixtures, so keep it on one
      # stable Helm version instead of the runner's preinstalled one, and
      # run it on a single matrix leg only.
      - name: Install helm (early, for pre-commit hooks)
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 3.22.1
        if: matrix.helm == 'latest'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
        if: matrix.helm == 'latest'
      - run: pre-commit run --all-files --color=always
        env:
          SKIP: helm-lock
        if: matrix.helm == 'latest'
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()
      - name: Print environment information
        run: c2cciutils-env
        env:
          GITHUB_EVENT: ${{ toJson(github) }}

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - run: helm dependency update .
      - run: helm lint .
        if: matrix.helm == 'latest'
      - run: helm lint --values=tests/values.yaml .
        if: matrix.helm == 'latest'

      - name: Setup k3s/k3d
        run: c2cciutils-k8s-install

      - name: Install prometheus CRD
        run: |
          curl https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/jsonnet/prometheus-operator/podmonitors-crd.json --output /tmp/podmonitors-crd.json
          kubectl apply -f /tmp/podmonitors-crd.json
      - name: Install external-secret CRD
        run: |
          curl https://raw.githubusercontent.com/external-secrets/external-secrets/v0.16.1/deploy/crds/bundle.yaml --output /tmp/external-secrets-crd.yaml
          kubectl apply -f /tmp/external-secrets-crd.yaml
      - name: Install Traefik CRD
        run: |
          curl https://raw.githubusercontent.com/traefik/traefik-helm-chart/v36.1.0/traefik/crds/traefik.io_middlewares.yaml --output /tmp/traefik-middlewares-crd.yaml
          kubectl apply -f /tmp/traefik-middlewares-crd.yaml
          curl https://raw.githubusercontent.com/traefik/traefik-helm-chart/v36.1.0/traefik/crds/traefik.io_ingressroutes.yaml --output /tmp/traefik-ingressroutes-crd.yaml
          kubectl apply -f /tmp/traefik-ingressroutes-crd.yaml

      - name: Apply
        run: kubectl apply -f tests/expected.yaml

      # Mark as success
      - id: success
        run: |
          version=${{ matrix.helm }}
          echo "success-${version//./-}=true" >> $GITHUB_OUTPUT

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: main
    if: always()

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - run: '[[ "${{ needs.main.outputs.success-latest }}" == "true" ]]'
      - run: '[[ "${{ needs.main.outputs.success-3-5-1 }}" == "true" ]]'

      # The full history is required to compute the version from the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          cache-python: true
          python-version: '3.14'

      # tag-publish downloads `cr` and `cosign` itself, but it uses the helm CLI to package the chart.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      # tag-publish packages the chart, the dependencies must be present.
      - run: helm dependency update .

      - name: Publish
        run: uv run --locked --isolated --no-build --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
